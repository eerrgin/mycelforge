name: Resilience Lab Tests

on:
  push:
    paths:
      - "resilience-lab/**"
      - ".github/workflows/resilience-lab.yml"
  pull_request:
    paths:
      - "resilience-lab/**"
      - ".github/workflows/resilience-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run resilience lab tests
        working-directory: resilience-lab
        run: npm test
