name: MycelForge CI and static bundle

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "pages.html"
      - "vite.config.pages.ts"
      - "package.json"
      - "package-lock.json"
      - "mycelforge/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mycelforge-ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify engine/UI mirror copies
        run: npm run check:mycel-mirrors

      - name: Verify CLI and all example briefs
        run: npm run check:forge-cli

      - name: Run MycelForge engine tests
        run: npm run test:mycel

      - name: Smoke-test CLI output
        run: npm run forge -- --json

      - name: Build static web bundle
        run: npm run build:pages

      - name: Upload static web bundle
        uses: actions/upload-artifact@v4
        with:
          name: mycelforge-static-site
          path: dist-pages
          if-no-files-found: error
          retention-days: 14
